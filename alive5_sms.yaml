openapi: 3.0.0
info:
  title: Alive5 SMS
  version: 1.0.0
  description: >-
    Send SMS and list Alive5 channels, users, and recent SMS conversations.
    Alive5 returns HTTP 200 even for API errors. Inspect code and error in the
    response body, including nested data.code, data.error, and data.errors,
    before treating an action as successful.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Alive5
    url: https://www.alive5.com/api
  x-logo: data:image/png;base64,
  x-categories:
    - Communication
servers:
  - url: https://api.alive5.com/public/1.0
security:
  - ApiKeyAuth: []
tags:
  - name: SMS
    description: Alive5 SMS messaging and channel discovery.
paths:
  /objects/channels-and-users/list:
    get:
      operationId: list_channels_and_users
      summary: List channels and users
      description: >-
        List accessible channels and their assigned agents. Select an SMS
        channel whose channel_label is your business phone number; use its
        channel_id and an assigned agent's user_id when sending SMS.
      tags: [SMS]
      responses:
        '200':
          description: >-
            Alive5 envelope. Channels are in data.Items; each has channel_id,
            channel_label, and agents with user_id and screen_name.
            Check body code and error even when HTTP status is 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alive5Response'
              example:
                code: 200
                error: {}
                data:
                  Items:
                    - channel_id: example-channel-id
                      channel_label: '+14155550100'
                      agents:
                        - user_id: example-user-id
                          screen_name: Example Agent
  /conversations/sms/send:
    post:
      operationId: send_sms
      summary: Send SMS
      description: >-
        Submit one text message. Use phone_number_from and channel_id from
        List channels and users, and a user_id assigned to that channel.
        A returned data.data.message_id confirms submission, not delivery.
        Check body-level errors; inspect conversation history before retrying
        an ambiguous result to avoid sending duplicate messages.
      tags: [SMS]
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            enum: [application/json]
          example: application/json
      requestBody:
        required: true
        description: Business number, recipient, channel, sending user, and SMS text.
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_number_from
                - phone_number_to
                - channel_id
                - user_id
                - message
              properties:
                phone_number_from:
                  type: string
                  description: Alive5 business SMS number in E.164 format.
                  pattern: '^\+[1-9][0-9]{7,14}$'
                  example: '+14155550100'
                phone_number_to:
                  type: string
                  description: Recipient phone number in E.164 format.
                  pattern: '^\+[1-9][0-9]{7,14}$'
                  example: '+14155550123'
                channel_id:
                  type: string
                  description: Channel ID associated with the business SMS number.
                  minLength: 1
                  example: example-channel-id
                user_id:
                  type: string
                  description: ID of an agent assigned to the selected channel.
                  minLength: 1
                  example: example-user-id
                message:
                  type: string
                  description: Text of the SMS; must contain non-whitespace characters.
                  minLength: 1
                  pattern: '\S'
                  example: Hello from Alive5.
            example:
              phone_number_from: '+14155550100'
              phone_number_to: '+14155550123'
              channel_id: example-channel-id
              user_id: example-user-id
              message: Hello from Alive5.
      responses:
        '200':
          description: >-
            Alive5 envelope. The submitted message ID is data.data.message_id.
            Check code and error at the top level and inside data before
            treating the request as successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alive5Response'
              example:
                code: 200
                error: {}
                data:
                  data:
                    message_id: example-message-id
  /conversations/sms:
    get:
      operationId: list_sms_conversations
      summary: List SMS conversations
      description: >-
        Return recent SMS conversations in data.Items. This action is a
        snapshot, not a new-message trigger or a complete message archive.
      tags: [SMS]
      responses:
        '200':
          description: >-
            Alive5 envelope containing recent conversations. Check body code
            and error even when HTTP status is 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alive5Response'
              example:
                code: 200
                error: {}
                data:
                  Items: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-A5-APIKEY
  schemas:
    Alive5Response:
      type: object
      description: >-
        Raw Alive5 envelope, including API errors returned with HTTP 200.
        Workflows must inspect body-level status and error fields.
      properties:
        code:
          type: integer
          description: Alive5 application status code.
          example: 200
        error:
          description: Empty on success; may contain API error details on failure.
        data:
          type: object
          description: Endpoint data; may also contain nested status or error fields.
          additionalProperties: true
      additionalProperties: true
