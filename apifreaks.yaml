                country: United States
                full_address: LensCrafters, 7, West 34th Street, Midtown South, Manhattan Community Board
                  5, Manhattan, New York County, New York, 10001, United States
                bounding_box:
                - '40.7489169'
                - '40.7490169'
                - '-73.9854490'
                - '-73.9853490'
        '400':
          description: Bad Request – one or more parameters are invalid
          content:
            application/json:
              schema:
                type: object
