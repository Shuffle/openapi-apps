  /v1.0/subdomains/lookup:
    get:
      tags:
      - Domain
      summary: Get subdomains related to the given domain name.
      description: The Subdomain Lookup API is designed to retrieve subdomains related to the given domain
        name. It helps you explore subdomains that are available for registration or usage.
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - xml
        description: Format of the response.
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain name for availability and suggestions.
      - name: after
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter subdomains seen after this date (format YYYY-MM-DD).
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter subdomains seen before this date( format YYYY-MM-DD).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
