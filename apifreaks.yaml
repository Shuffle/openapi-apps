    IpGeolocationGeolocationResponse:
      type: object
      properties:
        ip:
          type: string
          description: IP address that is used to lookup geolocation information.
        domain:
          type: string
          description: Domain name that is used to lookup geolocation information. It is not returned
            if an IP address is used to query IP Geolocation API.
        hostname:
          type: string
          description: Hostname of the IP address used to query IP Geolocation API.
        location:
          type: object
          description: The location information
          properties:
            continent_code:
              type: string
              description: 2-letter code of the continent.
            continent_name:
              type: string
              description: Name of the continent.
            country_code2:
              type: string
              description: Country code (ISO 3166-1 alpha-2) of the country.
            country_code3:
              type: string
              description: Country code (ISO 3166-1 alpha-3) of the country.
            country_name:
              type: string
              description: Name of the country.
            country_name_official:
              type: string
              description: Official name (ISO 3166) of the country.
            country_capital:
              type: string
              description: Name of the country’s capital.
            state_prov:
              type: string
              description: Name of the state/province/region.
            state_code:
              type: string
              description: Code of the state/province/region.
            district:
              type: string
              description: Name of the district or county.
            city:
              type: string
              description: Name of the city.
            locality:
              type: string
              description: A more specific area in city or it can be same as city.
            accuracy_radius:
              type: string
              description: Circular radius in Km, where the IP address location can be found.
            dma_code:
              type: string
              description: Representing Designated Market Area (DMA) code specifically used in the United
                States for media marketing.
              nullable: true
            zipcode:
              type: string
              description: ZIP/Postal code of the place.
            latitude:
              type: string
              description: Latitude of the place.
            longitude:
              type: string
              description: Longitude of the place.
            is_eu:
              type: boolean
              description: Is the country belong to European Union?
            country_flag:
              type: string
              format: uri
              description: URL to get the country flag.
            geoname_id:
              type: string
              description: Geoname ID of the place from geonames.org
            country_emoji:
              type: string
              description: Emoji of the Country flag.
        country_metadata:
          type: object
          description: The country metadata
          properties:
            calling_code:
              type: string
              description: Calling code/Dialing code of the country.
            tld:
              type: string
              description: Top Level Domain Name (TLD) of the country, which is also called ccTLD.
            languages:
              type: array
              items:
                type: string
              description: List of the languages’ codes, spoken in the country.
        network:
          type: object
          description: The network information
          properties:
            asn:
              type: object
              properties:
                as_number:
                  type: string
                  description: Autonomous system number of the autonomous system, to which IP address
                    belongs to.
                organization:
                  type: string
                  description: Legal Full Name of AS organization holding the IP address.
                country:
                  type: string
                  description: Name of the country, ASN is residing.
                asn_name:
                  type: string
                  description: Name associated with the Autonomous System, usually representing organization.
                type:
                  type: string
                  description: Type of the ASN, whether ISP, Business, etc.
                domain:
                  type: string
                  description: Domain name associated with the ASN holding the IP address.
                date_allocated:
                  type: string
                  description: Last date, when the IP address assigned to the ASN. e.g., in format 1st
                    June 2001
                allocation_status:
                  type: string
                  description: Whether the IP address is currently assigned to the ASN or not.
                num_of_ipv4_routes:
                  type: string
                  description: Total number of IPv4 routes, held by the ASN. These Routes can be queried
                    from our ASN API.
                num_of_ipv6_routes:
                  type: string
                  description: Total number of IPv6 routes, held by the ASN. These Routes can be queried
                    from our ASN API.
                rir:
                  type: string
                  description: Name of the Regional Internet Registry (RIR) that allocated the AS number.
            connection_type:
              type: string
              description: Type of the connection, consuming the IP address.
            company:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the company/ISP holding the IP address.
                type:
                  type: string
                  description: Type of the company whether it is an ISP, hosting provider or business,
                    etc.
                domain:
                  type: string
                  description: Official domain name used by the company.
        currency:
          type: object
          description: The currency information
          properties:
            code:
              type: string
              description: Currency code (ISO 4217).
              example: PKR
            name:
              type: string
              description: Currency name (ISO 4217).
              example: Pakistan Rupee
            symbol:
              type: string
              description: Currency symbol.
              example: ₨
        security:
          type: object
          description: The security information
          properties:
            threat_score:
              type: number
              description: IP address’ threat score. It ranges from 0 to 100. 100 indicates highest threat
                and vice versa for lower score.
            is_tor:
              type: boolean
              description: Indicates if the IP address is being consumed on a Tor endpoint.
            is_proxy:
              type: boolean
              description: Indicates whether the IP address is associated with any anonymization network
                —VPN, PROXY, or RELAY.
            proxy_type:
              type: string
              description: Specifies which of the three types (VPN, PROXY, or RELAY) applies when is_proxy
                is true; otherwise remains empty.
              nullable: true
            proxy_provider:
              type: string
              description: Name of the proxy provider, if the IP address belongs to a proxy network.
              nullable: true
            is_anonymous:
              type: boolean
              description: Indicates if the IP address is being used anonymously.
            is_known_attacker:
              type: boolean
              description: Indicates if the IP address is enlisted as an attacking IP address.
            is_spam:
              type: boolean
              description: Indicates if the IP address is enlisted as a spam IP address.
            is_bot:
              type: boolean
              description: Indicates if the IP address is enlisted as a bot IP address.
            is_cloud_provider:
              type: boolean
              description: Indicates if the IP address belongs to a cloud provider (computing infrastructure
                providers).
            cloud_provider:
              type: string
              description: Name of the Cloud Provider, if the IP address belongs to a cloud provider.
              nullable: true
        abuse:
          type: object
          description: The abuse information
          properties:
            route:
              type: string
              description: Network route associated with the IP address.
            country:
              type: string
              description: Country where the responsible entity is located.
            handle:
              type: string
              description: Abuse handle or ID found in WHOIS or RDAP records.
            name:
              type: string
              description: Name of the abuse contact person or entity.
            organization:
              type: string
              description: Organization responsible for the IP address.
            role:
              type: string
              description: Role of the contact (e.g., abuse, administrative, registrant, etc.).
            kind:
              type: string
              description: 'Type of contact: individual, team, or organization.'
            address:
              type: string
              description: Physical mailing address of the responsible entity.
            emails:
              type: array
              items:
                type: string
              description: Email address(es) of the abuse contact.
            phone_numbers:
              type: array
              items:
                type: string
              description: Phone number(s) in international format for the abuse contact.
        time_zone:
          type: object
          description: The time zone information
          properties:
            name:
              type: string
              description: Name (ISO 8601) of the time zone.
            offset:
              type: number
              description: Time zone offset from UTC.
            offset_with_dst:
              type: number
              description: Time zone with DST offset from UTC.
            current_time:
              type: string
              description: Current time in yyyy-MM-dd HH:mm:ss.SSS±ZZZ format.
            current_time_unix:
              type: number
              description: Current time in seconds since 1970.
            is_dst:
              type: boolean
              description: Is the time zone in daylight savings?
            dst_savings:
              type: number
              description: Total daylight savings.
            dst_exists:
              type: boolean
              description: Indicates whether Daylight Saving Time (DST) is observed in the region. If
                true, the dst_start and dst_end objects will include detailed DST transition information.
            dst_start:
              type: object
              properties:
                utc_time:
                  type: string
                  description: The date and time in UTC when DST begins.
                duration:
                  type: string
                  description: The time change that occurs when DST starts.
                gap:
                  type: boolean
                  description: Is there a gap when the clocks jump forward or not.
                date_time_after:
                  type: string
                  description: The local date and time that immediately follows the start of DST.
                date_time_before:
                  type: string
                  description: The local date and time immediately before DST begins.
                overlap:
                  type: boolean
                  description: Whether there is an overlap of time due to clocks being set back when DST
                    starts.
            dst_end:
              type: object
              properties:
                utc_time:
                  type: string
                  description: The date and time in UTC when DST ends.
                duration:
                  type: string
                  description: The time change that occurs when DST ends.
                gap:
                  type: boolean
                  description: Is there a gap when the clocks jump backward or not.
                date_time_after:
                  type: string
                  description: The local date and time that immediately follows the ends of DST.
                date_time_before:
                  type: string
                  description: The local date and time immediately before DST ends.
                overlap:
                  type: boolean
                  description: Whether there is an overlap of time due to clocks being set back when DST
                    ends.
        user_agent:
          type: object
          description: The user agent information
          properties:
            user_agent_string:
              type: string
              description: User-Agent string passed along with the query in the User-Agent header.
              example: Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:142.0) Gecko/20100101 Firefox/142.0
            name:
              type: string
              description: User-Agent Name.
              example: Firefox
            type:
              type: string
              description: User-Agent Class.
              example: Browser
            version:
              type: string
              description: User-Agent Version.
              example: '142.0'
            version_major:
              type: string
              description: User-Agent Version Major.
              example: '142'
            device:
              type: object
              properties:
                name:
                  type: string
                  description: Device Name.
                  example: Linux Desktop
                type:
                  type: string
                  description: Device Type.
                  example: Desktop
                brand:
                  type: string
                  description: Device Brand.
                  example: Unknown
                cpu:
                  type: string
                  description: Device CPU Model.
                  example: Intel x86_64
            engine:
              type: object
              properties:
                name:
                  type: string
                  description: Layout Engine Name.
                  example: Gecko
                type:
                  type: string
                  description: Layout Engine Class.
                  example: Browser
                version:
                  type: string
                  description: Layout Engine Version.
                  example: '142.0'
                version_major:
                  type: string
                  description: Layout Engine Version Major.
                  example: '142'
            operating_system:
              type: object
              properties:
                name:
                  type: string
                  description: Operating System Name.
                  example: Ubuntu
                type:
                  type: string
                  description: Operating System Class.
                  example: Desktop
                version:
                  type: string
                  description: Operating System Version.
                  example: ??
                version_major:
                  type: string
                  description: Operating System Version Major.
                  example: ??
                build:
                  type: string
                  description: Operating System Build.
                  example: ??
      example:
        ip: 8.8.8.8
        location:
          continent_code: NA
          continent_name: North America
          country_code2: US
          country_code3: USA
          country_name: United States
          country_name_official: United States of America
          country_capital: Washington, D.C.
          state_prov: California
          state_code: US-CA
          district: Santa Clara
          city: Mountain View
          locality: Mountain View
          accuracy_radius: '23.387'
          confidence: low
          zipcode: 94043-1351
          latitude: '37.42240'
          longitude: '-122.08421'
          is_eu: false
          country_flag: https://ipgeolocation.io/static/flags/us_64.png
          geoname_id: '6301403'
          country_emoji: 🇺🇸
        country_metadata:
          calling_code: '+1'
          tld: .us
          languages:
          - en-US
          - es-US
          - haw
          - fr
        network:
          asn:
            as_number: AS15169
            organization: Google LLC
            country: US
            asn_name: GOOGLE
            type: BUSINESS
            domain: about.google
            date_allocated: ''
            allocation_status: assigned
            num_of_ipv4_routes: '996'
            num_of_ipv6_routes: '104'
            rir: ARIN
          connection_type: ''
          company:
            name: Google LLC
            type: ''
            domain: ''
        currency:
          code: USD
          name: US Dollar
          symbol: $
