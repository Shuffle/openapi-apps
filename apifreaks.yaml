      summary: Check whether a domain is available for registration or not.
      description: The Domain Search API is designed to simplify the process of finding available domain
        names across all top-level domains (TLDs) and second-level domains (SLDs).
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - xml
        description: Format of the response.
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain name whose availability is to be checked.
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - dns
          - whois
          default: dns
        description: Specify the data source for domain availability checks. Use "dns" for DNS-based lookups
          or "whois" for WHOIS-based lookups. By default, "dns" is used.
      responses:
        '200':
