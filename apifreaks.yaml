          description: Specific kind within the category, e.g. fast_food, city, park, residential, house_number.
        poi:
          type: array
          description: Array describing the POI (point of interest) and closely related elements at this
            location.
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the POI of the searched place.
              category:
                type: string
                description: Category of the POI, e.g. amenity, place, natural, building, highway.
              type:
                type: string
                description: Specific type of the category for the POI, e.g. fast_food, city, park, residential,
                  house_number.
        street:
          type: string
          description: Street or road name.
        area:
          type: string
          description: Intra-city area below city level, e.g. suburb, borough, quarter, ward, district,
            sector, zone, tehsil, taluka, neighbourhood.
        postcode:
          type: string
          description: Postal code of the area.
        city:
          type: string
          description: Settlement label appropriate to the country, e.g. city, town, municipality.
        county:
          type: string
          description: Second-tier administrative area, e.g. county, district, shire, prefecture.
        state_code:
          type: string
          description: Subdivision code when available, typically ISO-3166-2 like US-TX or PK-PB.
        state:
          type: string
          description: First-tier administrative area; varies by country, e.g. state, region, province,
            division, autonomous community.
        country_code:
          type: string
          description: Two-letter country code in upper case, ISO-3166-1 alpha-2.
        country:
          type: string
          description: Country name of the searched place.
        full_address:
          type: string
          description: Single-line, human-readable address of the location.
        bounding_box:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4
          description: Extent of the feature as `[lat_min, lat_max, lon_min, lon_max]` (south, north,
            west, east) in WGS84 decimal degrees.
