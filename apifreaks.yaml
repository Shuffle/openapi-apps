                InvalidLatitudeRange: {}
                InvalidLongitudeRange: {}
                InvalidLatitudeValue: {}
                InvalidLongitudeValue: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized: {}
              schema:
                type: object
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                ResultNotFound: {}
              schema:
                type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                ServerError: {}
              schema:
                type: object
