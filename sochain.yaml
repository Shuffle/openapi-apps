              schema:
                type: object
      summary: Where an address stands among the largest holders
      operationId: Get_address_rank
      description: 'Its exact rank within the top 10,000 and its share of all coins. Docs: https://sochain.com/docs/address_rank'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
