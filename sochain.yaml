  /transaction/{network}/{hash}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: One transaction
      operationId: Get_transaction
      description: 'Confirmations, size, fee, and every input and output. Docs: https://sochain.com/docs/transaction'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: hash
        description: 'Transaction ID: 64 hex characters (any case).'
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
      - in: query
        name: currency
        description: 'Prices in this currency instead of US dollars (any case). Not a filter: on the paged endpoints it keeps the form you''d get without it.'
        required: false
        schema:
          type: string
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - CNY
          - CZK
          - DKK
          - EUR
          - GBP
          - HKD
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KRW
          - MXN
          - MYR
          - NOK
          - NZD
          - PHP
          - PLN
          - RON
          - SEK
          - SGD
          - THB
          - TRY
          - USD
          - ZAR
  /transaction_status/{network}/{hash}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: Whether a transaction is pending, mined, replaced or dropped
      operationId: Get_transaction_status
      description: 'A transaction is replaced when another one spends one of its inputs (a fee bump, a double spend, or a transaction it spends from being replaced) and dropped when the mempool lets it go unconfirmed. SoChain remembers a transaction that left the mempool for about a day; after that, or for one SoChain never saw, the status is unknown. Docs: https://sochain.com/docs/transaction_status'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: hash
        description: 'Transaction ID: 64 hex characters (any case).'
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
  /block/{network}/{hash_or_height}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: One block, by height or hash
      operationId: Get_block
      description: 'Header, subsidy (reward), fees, value out and every transaction ID. Docs: https://sochain.com/docs/block'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: hash_or_height
        description: A block height (up to 8 digits) or block hash (64 hex characters, any case).
        required: true
        schema:
          type: string
          pattern: ^([0-9]{1,8}|[0-9a-fA-F]{64})$
