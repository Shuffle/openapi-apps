swagger: '3.0'
info:
  title: SoChain
  description: |-
    Balances, transactions, blocks, the mempool and fee quotes for Bitcoin, Litecoin, Dogecoin and Zcash (transparent), and their testnets: BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST and ZECTEST.

    ### Authentication

    The API key is optional. Without one, lookups are limited to 2,500 a day per IP. With a key, the plan's monthly requests apply; a free account gives 75,000 a month. Get a key at https://sochain.com/dashboard and send it in the `API-KEY` header. Get account info always needs a key.

    Answers are JSON: `{"status": "success", "data": {...}}` or `{"status": "fail", "data": {"error_message": "..."}}`. Amounts are exact decimal strings with 8 decimals.

    Docs: https://sochain.com/docs
  version: '3'
  x-logo: data:image/png;base64,
  contact:
    name: SoChain support
    url: https://sochain.com/support
  x-categories:
  - Intel
servers:
- url: https://sochain.com/api/v3
host: sochain.com
basePath: /api/v3
schemes:
- 'https:'
paths:
  /balance/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: Balance of an address
      operationId: Get_balance
      description: 'Confirmed balance and the pending change from the mempool; with height or time, the confirmed balance at that point instead. Docs: https://sochain.com/docs/balance'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
      - in: query
        name: height
        description: The confirmed balance at the end of this block, instead of now.
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: time
        description: 'The confirmed balance at this time, instead of now: Unix seconds, a UTC date (meaning the end of that day) or an RFC 3339 timestamp. It''s taken at the last block at or before it. Not together with height.'
        required: false
        schema:
          type: string
  /address_summary/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: Sent, received and balance at a glance
      operationId: Get_address_summary
      description: 'Transaction counts in each direction, balances, and everything ever received. Docs: https://sochain.com/docs/address_summary'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
  /transactions/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: An address's transactions (page 1, or filtered)
      operationId: Get_transactions
      description: 'Ten per page: unconfirmed first, then newest first. With any history filter, the filtered form: the same rows filtered by block, time and direction, paged by cursor, as JSON or CSV. Docs: https://sochain.com/docs/transactions'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
      - in: query
        name: from_height
        description: 'History filter: from this block on (inclusive).'
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: to_height
        description: 'History filter: up to this block (inclusive).'
        required: false
        schema:
          type: integer
          minimum: 0
      - in: query
        name: from_time
        description: 'History filter: from this time on. Unix seconds, a UTC date (from its first second) or an RFC 3339 timestamp.'
        required: false
        schema:
          type: string
      - in: query
        name: to_time
        description: 'History filter: up to this time. Unix seconds, a UTC date (to its last second) or an RFC 3339 timestamp. Times map to the blocks they cover, so back-to-back ranges neither overlap nor leave a gap.'
        required: false
        schema:
          type: string
      - in: query
        name: direction
        description: 'History filter: in (the balance went up), out (it went down) or both. By the net amount: a payment out with change back counts once, as out.'
        required: false
        schema:
          type: string
          enum:
          - in
          - out
          - both
          default: both
      - in: query
        name: unconfirmed
        description: 'History filter: pending transactions. Default include, or exclude when the range has an end (to_height or to_time), which can''t be combined with include or only.'
        required: false
        schema:
          type: string
          enum:
          - include
          - exclude
          - only
      - in: query
        name: page_size
        description: 'Rows per page of the filtered form: 1–100 (default 10); with format=csv 1–500 (default 500).'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
      - in: query
        name: cursor
        description: next_cursor from the previous page of the filtered form. It carries the filters, so it can be sent on its own.
        required: false
        schema:
          type: string
          maxLength: 4096
      - in: query
        name: format
        description: json (default) or csv. CSV has one row per transaction (time_utc, block, txid, direction, received, sent, net, price_usd, net_usd); the next page's URL is in the Link header.
        required: false
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      - in: query
        name: currency
        description: 'Prices in this currency instead of US dollars (any case). Not a filter: on the paged endpoints it keeps the form you''d get without it.'
        required: false
        schema:
          type: string
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - CNY
          - CZK
          - DKK
          - EUR
          - GBP
          - HKD
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KRW
          - MXN
          - MYR
          - NOK
          - NZD
          - PHP
          - PLN
          - RON
          - SEK
          - SGD
          - THB
          - TRY
          - USD
          - ZAR
  /transactions/{network}/{address}/{page}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: An address's transactions, by page
      operationId: Get_transactions_by_page
      description: 'Ten per page: unconfirmed first, then newest first. Page numbers don''t combine with filters (400): leave the page out for the filtered form. Docs: https://sochain.com/docs/transactions'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
      - in: path
        name: page
        description: Page number from 1; ten results per page. Anything but a 1–6 digit number means page 1.
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: currency
        description: 'Prices in this currency instead of US dollars (any case). Not a filter: on the paged endpoints it keeps the form you''d get without it.'
        required: false
        schema:
          type: string
          enum:
          - AUD
          - BRL
          - CAD
          - CHF
          - CNY
          - CZK
          - DKK
          - EUR
          - GBP
          - HKD
          - HUF
          - IDR
          - ILS
          - INR
          - ISK
          - JPY
          - KRW
          - MXN
          - MYR
          - NOK
          - NZD
          - PHP
          - PLN
          - RON
          - SEK
          - SGD
          - THB
          - TRY
          - USD
          - ZAR
