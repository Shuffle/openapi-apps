      summary: Unspent outputs of an address (page 1)
      operationId: Get_unspent_outputs
      description: 'Ten per page, oldest first, each with its funding transaction. Docs: https://sochain.com/docs/unspent_outputs'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
