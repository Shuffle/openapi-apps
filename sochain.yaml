          - MYR
          - NOK
          - NZD
          - PHP
          - PLN
          - RON
          - SEK
          - SGD
          - THB
          - TRY
          - USD
          - ZAR
  /latest_blocks_summary/{network}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: The last ten blocks
      operationId: Get_latest_blocks_summary
      description: 'Newest first, with miner address and reward plus fees. Docs: https://sochain.com/docs/latest_blocks_summary'
