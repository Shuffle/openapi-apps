              schema:
                type: object
      summary: Is this a valid address on this network?
      operationId: Is_valid_address
      description: 'A malformed address answers is_valid: false, never an error. Docs: https://sochain.com/docs/is_valid_address'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
