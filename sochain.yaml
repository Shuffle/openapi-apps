          pattern: ^[A-Za-z0-9]{1,1000}$
  /address_poisoning/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: Whether an address was targeted by address poisoning
      operationId: Get_address_poisoning
      description: 'Look-alike addresses that sent it dust, imitating an address it really paid or was paid by, so a careless copy from its history pays the scammer. Docs: https://sochain.com/docs/address_poisoning'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
      - in: query
        name: limit
        description: 'Rows: 1 to 100, default 50, newest first.'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /address_counterparties/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: Who an address pays and is paid by, lately
      operationId: Get_address_counterparties
      description: 'Payments of a significant amount within the window the poisoning check watches, newest first. Docs: https://sochain.com/docs/address_counterparties'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
