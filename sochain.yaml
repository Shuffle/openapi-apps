  /balance_history/{network}/{address}:
    get:
      responses:
        default:
          description: default
          content:
            application/json:
              schema:
                type: object
      summary: An address's balance by day, week or month
      operationId: Get_balance_history
      description: 'With what came in and went out in each interval and how many transactions did each. Without an API key at most 2,000 points, with one 20,000. Docs: https://sochain.com/docs/balance_history'
      parameters:
      - in: path
        name: network
        description: Network code (any case). BTCTEST is Bitcoin testnet4.
        required: true
        schema:
          type: string
          enum:
          - BTC
          - LTC
          - DOGE
          - ZEC
          - BTCTEST
          - LTCTEST
          - DOGETEST
          - ZECTEST
      - in: path
        name: address
        description: An address (letters and digits).
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9]{1,1000}$
      - in: query
        name: interval
        description: One point per day (default), week (Monday to Sunday, UTC) or month.
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: day
      - in: query
        name: from
        description: 'Start: Unix seconds, a UTC date (from its first second) or an RFC 3339 timestamp. Default: the address''s first activity (without an API key, daily points cover the most recent 2,000).'
        required: false
        schema:
          type: string
      - in: query
        name: to
        description: 'End, in the same forms (a date means its last second). Default: now.'
        required: false
        schema:
          type: string
  /address_rank/{network}/{address}:
